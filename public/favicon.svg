<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="128" height="128" rx="28" fill="url(#emGrad)"/>
  <!-- Subtle Inner Border -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Decorative Islamic Geometry Star / Diamond Motif Accent -->
  <g opacity="0.15" fill="#ffffff">
    <polygon points="64,12 70,26 84,26 73,35 77,49 64,40 51,49 55,35 44,26 58,26"/>
  </g>
  <!-- Clean Bold Typography "EF" -->
  <text x="64" y="77" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
        font-size="52" 
        font-weight="800" 
        letter-spacing="-1.5"
        fill="#ffffff" 
        text-anchor="middle">EF</text>
  <!-- Subtle Bottom Bar -->
  <rect x="44" y="94" width="40" height="4" rx="2" fill="#34d399" opacity="0.8"/>
</svg>
